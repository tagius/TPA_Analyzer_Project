[project]
name = "tpa-analyzer"
version = "1.1"
description = "Terminal TPA analyzer for Zwick double-compression data."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "matplotlib>=3.8",
  "numpy>=2.0",
  "pandas>=2.2",
  "pingouin>=0.5.5",
  "scipy>=1.13",
  "textual>=0.58",
]

[dependency-groups]
dev = [
  "pyinstaller>=6.5",
  "pytest>=8.1",
  "ruff>=0.11",
]

[project.scripts]
tpa-analyzer = "tpa_analyzer.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tpa_analyzer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["N818"]

[tool.ruff.format]
quote-style = "double"
